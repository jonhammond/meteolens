# Render blueprint for MeteoLens.
#
# Every secret is `sync: false`: Render prompts for the value in the dashboard
# and stores it there instead of in this file. Never put real values here —
# this file is committed to git.
services:
  - type: web
    name: meteolens
    runtime: python
    plan: free
    region: oregon
    branch: main
    buildCommand: pip install -r requirements.txt
    # app.create_app() validates the environment at import time, so a missing
    # secret fails the deploy at boot rather than at the first request.
    startCommand: gunicorn wsgi:app
    # Also the cron :57 pre-warm target in M6 — free instances sleep when idle.
    healthCheckPath: /healthz
    envVars:
      # Pin the interpreter to the version used in development (3.11.14).
      - key: PYTHON_VERSION
        value: "3.11.14"
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: POWERBI_PUSH_URL
        sync: false
      - key: INGEST_TOKEN
        sync: false
      # Service-principal embed ("Embed for your customers"). While any of
      # the five are unset the page renders a "report pending" placeholder
      # instead of the live report.
      - key: POWERBI_TENANT_ID
        sync: false
      - key: POWERBI_CLIENT_ID
        sync: false
      - key: POWERBI_CLIENT_SECRET
        sync: false
      - key: POWERBI_WORKSPACE_ID
        sync: false
      - key: POWERBI_REPORT_ID
        sync: false
      # Paid Open-Meteo key — routes fetches to customer-api.open-meteo.com
      # with a per-key quota. Required on Render: the free keyless API is
      # metered per source IP, and Render's shared egress IPs are exhausted
      # by other tenants. Optional locally (unset = free keyless host).
      - key: OPEN_METEO_API_KEY
        sync: false
