name: Hourly ingest

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch: {}

permissions: {}

concurrency:
  group: ingest
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Pre-warm (wait out Render cold start)
        run: |
          for i in $(seq 1 8); do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 https://meteolens.jonhammond.org/healthz || true)
            echo "healthz attempt $i: HTTP $code"
            [ "$code" = "200" ] && exit 0
            sleep 10
          done
          echo "healthz never returned 200" >&2
          exit 1

      - name: Run ingest
        env:
          INGEST_TOKEN: ${{ secrets.INGEST_TOKEN }}
        run: |
          curl -sS --fail-with-body --max-time 120 \
            -X POST https://meteolens.jonhammond.org/api/ingest \
            -H "Authorization: Bearer ${INGEST_TOKEN}" \
            -o ingest.json
          cat ingest.json
          echo
          # The endpoint returns HTTP 200 even when every location failed; each
          # key carries "ok", "skipped: ...", or "error: ...". Fail the run on
          # any "error" so a broken upstream (expired API key, 429, DB outage)
          # shows up as a red run and an email, not a green run with no rows.
          errors=$(jq -r 'to_entries[] | select(.value | startswith("error")) | "\(.key): \(.value)"' ingest.json)
          if [ -n "$errors" ]; then
            echo "::error::ingest reported errors"
            echo "$errors" >&2
            exit 1
          fi

      - name: Verify fresh data landed
        run: |
          newest=$(curl -sS --fail --max-time 60 https://meteolens.jonhammond.org/api/latest \
            | jq -r 'map(.recorded_at) | max // empty')
          if [ -z "$newest" ]; then
            echo "::error::/api/latest returned no recorded_at values"
            exit 1
          fi
          newest_s=$(date -u -d "$newest" +%s)
          now_s=$(date -u +%s)
          age=$(( now_s - newest_s ))
          echo "newest recorded_at: $newest (${age}s ago)"
          if [ "$age" -gt 10800 ]; then
            echo "::error::newest reading is older than 3 hours; ingest is not writing rows"
            exit 1
          fi
